name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun:
    name: Bun ${{ matrix.bun }} (Linux, with PostgreSQL + MySQL)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.4.0", latest]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bunyad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bunyad_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BUNYAD_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/bunyad_test
      BUNYAD_TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/bunyad_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test packages scripts
      - run: bun scripts/release.ts build

  macos:
    name: Bun tests (macOS, SQLite only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test packages

  node:
    name: Node ${{ matrix.node }} (database + orm)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bunyad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bunyad_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BUNYAD_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/bunyad_test
      BUNYAD_TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/bunyad_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      # Bun builds native modules with `bunx node-gyp@latest`, which no longer runs on Node 20,
      # and better-sqlite3 has no Node 20 prebuild. Skip Bun's install scripts and let npm
      # (which bundles a compatible node-gyp) run the better-sqlite3 install step.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build better-sqlite3 for this Node
        run: |
          dir=$(dirname "$(find node_modules/.bun -path '*better-sqlite3/package.json' -not -path '*@types*' | head -1)")
          npm run install --prefix "$dir"
      # Node 20 cannot strip types itself (needs 22.7+), so it loads the TypeScript tests through tsx.
      - run: bun run ${{ matrix.node == 20 && 'test:node:tsx' || 'test:node' }}
        working-directory: packages/database

  smoke:
    name: Scaffold and run (${{ matrix.kit }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kit: [api, views, live, react, vue, svelte]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: bun install --frozen-lockfile
      - run: bun scripts/release.ts pack
      - run: bun scripts/smoke.ts --kit=${{ matrix.kit }}

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan history and files
        run: |
          ./gitleaks git --redact --no-banner .
          ./gitleaks dir --redact --no-banner .
