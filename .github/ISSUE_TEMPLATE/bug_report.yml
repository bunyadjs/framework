name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: packages
    attributes:
      label: Package and version
      placeholder: "@bunyad/orm 0.2.0-beta.2"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: "Bun 1.4.0, or Node 22 + PostgreSQL 16"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened, and how can we reproduce it?
      description: A minimal code sample or repository is the fastest way to a fix.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
